name: Build desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:ui
      - run: node scripts/test-about-ui.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: test-results
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            name: mac
          - os: windows-latest
            command: package:win
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Verify Windows separate-profile secure storage
        if: runner.os == 'Windows'
        run: node scripts/windows-storage-smoke.mjs
      - run: npm run ${{ matrix.command }}
      - name: Smoke test packaged app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GROKDECK_EXECUTABLE = (Resolve-Path 'release/win-unpacked/GrokDeck.exe').Path
          node scripts/packaged-security-smoke.mjs
      - name: Verify unsigned Windows package and publisher privacy
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-unsigned.ps1
      - name: Install, verify, and uninstall the unsigned Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: ./scripts/windows-installer-smoke.ps1 -Unsigned
      - name: Smoke test packaged app on macOS
        if: runner.os == 'macOS'
        run: GROKDECK_EXECUTABLE="$PWD/release/mac-arm64/GrokDeck.app/Contents/MacOS/GrokDeck" node scripts/packaged-security-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GrokDeck-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/windows-unsigned-verification.json
            release/windows-installer-verification.json
          if-no-files-found: error
          retention-days: 14
